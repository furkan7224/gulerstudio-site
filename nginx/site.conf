server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript image/svg+xml;

    # HTTPS'i Coolify (Traefik/Caddy) sağlar; burada sadece içerik sunulur.
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Coolify sağlık kontrolü
    location = /saglik {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Yazı tipleri ve görseller uzun süre önbellekte kalsın
    location ~* \.(?:woff2|webp|png|svg|ico)$ {
        include /etc/nginx/snippets/guvenlik.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # HTML/CSS/JS: oyunlar.js değişince ziyaretçi hemen görsün
    location / {
        include /etc/nginx/snippets/guvenlik.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
